name: Release & Publish

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '24'

      - name: Check tag matches package version
        id: version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          ACTUAL_TAG="${GITHUB_REF_NAME}"

          echo "package.json version: ${PACKAGE_VERSION}"
          echo "git tag: ${ACTUAL_TAG}"

          if [ "${ACTUAL_TAG}" != "${EXPECTED_TAG}" ]; then
            echo "::error::Release tag ${ACTUAL_TAG} does not match package.json version ${PACKAGE_VERSION}. Expected ${EXPECTED_TAG}."
            exit 1
          fi

          echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

  test:
    name: Tests
    needs: validate
    uses: ./.github/workflows/tests.yml

  publish:
    name: Publish & Release
    needs: [validate, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Verify npm supports OIDC
        run: |
          NPM_VERSION=$(npm --version)
          echo "npm version: $NPM_VERSION"
          MAJOR=$(echo "$NPM_VERSION" | cut -d. -f1)
          MINOR=$(echo "$NPM_VERSION" | cut -d. -f2)
          PATCH=$(echo "$NPM_VERSION" | cut -d. -f3)
          if [ "$MAJOR" -lt 11 ] || \
             ([ "$MAJOR" -eq 11 ] && [ "$MINOR" -lt 5 ]) || \
             ([ "$MAJOR" -eq 11 ] && [ "$MINOR" -eq 5 ] && [ "${PATCH:-0}" -lt 1 ]); then
            echo "::error::npm >= 11.5.1 required for OIDC. Found: $NPM_VERSION"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: context.ref.replace('refs/tags/', ''),
              generate_release_notes: true,
            });
